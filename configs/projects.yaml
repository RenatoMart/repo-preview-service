# Catálogo de proyectos servidos por repo-preview-service.
#
# Esta lista es la fuente de verdad para el backend: define qué repos son
# consultables y qué URL se le permite capturar a chromedp (evita SSRF, ver
# internal/catalog/catalog.go). El frontend (personal-page) deja de mantener
# esta información en src/data/projects.ts y la consume vía GET /api/v1/projects.
#
# slug:        identificador corto usado en la URL de la API. Único.
# repo:        "owner/name" del repositorio en GitHub.
# title:       título mostrado en la tarjeta.
# category:    agrupación usada por el frontend (Todos/Trabajos Web/...).
# live:        URL desplegada, o cadena vacía si no existe (apps de escritorio/móvil).
# accent:      color de acento de la tarjeta generada.
# tags:        tecnologías mostradas como píldoras.
# description: texto corto mostrado bajo el título.

- slug: ing-agroindustrial
  repo: RenatoMart/ing-agroindustrial
  title: "Ing. Agroindustrial — Web Institucional"
  category: "Trabajos Web"
  live: "https://ingagroindustrial.vercel.app/"
  accent: "#2563eb"
  tags: ["React 18", "TypeScript", "Vite", "TailwindCSS", "Framer Motion", "Vercel"]
  description: >-
    Sitio web institucional reutilizable para escuelas universitarias de la UNT
    (coordinado por la Oficina de Calidad). Arquitectura de plantilla: código
    compartido + perfil por escuela.

